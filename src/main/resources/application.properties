# ---------------------------------------------------------------------------
# Oracle Database configuration
# ---------------------------------------------------------------------------
# Point these at a real Oracle instance via environment variables in each
# environment (local/dev/prod). Defaults below assume a local Oracle
# instance reachable at the standard listener port using the XE/free service
# name; override via DB_URL/DB_USERNAME/DB_PASSWORD as needed.
app.datasource.url=${DB_URL:jdbc:oracle:thin:@localhost:1521/XEPDB1}
app.datasource.username=${DB_USERNAME:system}
app.datasource.password=${DB_PASSWORD:oracle}
app.datasource.driver-class-name=${DB_DRIVER:oracle.jdbc.OracleDriver}

spring.datasource.url=${app.datasource.url}
spring.datasource.username=${app.datasource.username}
spring.datasource.password=${app.datasource.password}
spring.datasource.driver-class-name=${app.datasource.driver-class-name}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------------
# JWT configuration
# ---------------------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:afafasfafafasfasfasfafacasdasfasxASFACASDFACASDFASFASFDAFASFASDAADSCSDFADCVSGCFVADXCcadwavfsfarvf}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:1800000}
# Refresh token validity in milliseconds (default 7 days). Refresh tokens are
# opaque, database-persisted (see RefreshToken/RefreshTokenService) and used
# solely to obtain a new short-lived access token via /auth/refresh-token.
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# ---------------------------------------------------------------------------
# Actuator
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health

# ---------------------------------------------------------------------------
# API
# ---------------------------------------------------------------------------
app.api.prefix=/api/v1
app.api.pagination.default-limit=20
