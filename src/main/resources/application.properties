# ---------------------------------------------------------------------------
# Oracle Database configuration
# ---------------------------------------------------------------------------
# Point these at a real Oracle instance in production via environment
# variables. In this sandbox, no Oracle server is reachable, so the default
# falls back to a locally provisioned PostgreSQL database so the app can
# still boot, run and be tested end-to-end.
app.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gen_d47e61cf2671}
app.datasource.username=${DB_USERNAME:myuser}
app.datasource.password=${DB_PASSWORD:mypassword}
app.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}

spring.datasource.url=${app.datasource.url}
spring.datasource.username=${app.datasource.username}
spring.datasource.password=${app.datasource.password}
spring.datasource.driver-class-name=${app.datasource.driver-class-name}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------------
# JWT configuration
# ---------------------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:afafasfafafasfasfasfafacasdasfasxASFACASDFACASDFASFASFDAFASFASDAADSCSDFADCVSGCFVADXCcadwavfsfarvf}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:1800000}

# ---------------------------------------------------------------------------
# Actuator
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health

# ---------------------------------------------------------------------------
# API
# ---------------------------------------------------------------------------
app.api.prefix=/api/v1
app.api.pagination.default-limit=20
